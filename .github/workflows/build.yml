name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Rust tests
        run: cargo test --workspace --exclude mediadesk-desktop
      - name: Build UI and server
        run: |
          npm run build
          cargo build -p mediadesk-server
          chmod +x scripts/fake-code.sh
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: End-to-end tests
        run: npx playwright test

  bundle:
    name: Bundle (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            bundles: dmg,app
            artifact: mediadesk-macos
          - label: Windows
            os: windows-latest
            bundles: nsis
            artifact: mediadesk-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build portable browser server
        run: cargo build --release -p mediadesk-server
      - name: Build native bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          CI: true
      - name: Upload macOS artifacts
        if: matrix.label == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/mediadesk-server
      - name: Upload Windows artifacts
        if: matrix.label == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            target/release/bundle/nsis/*.exe
            target/release/mediadesk-server.exe
